<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SONYBOND Share File</title>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f3f4f6;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

h1,h2{
    margin-top:0;
}

.id-box{
    background:#111827;
    color:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    font-size:40px;
    font-weight:bold;
    letter-spacing:5px;
    margin-top:10px;
}

input[type=file],
input[type=text]{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #ccc;
    margin-top:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    background:#1d4ed8;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#f3f4f6;
}

.small{
    color:#666;
    font-size:14px;
    margin-top:10px;
}

.success{
    color:green;
}

.error{
    color:red;
}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>📤 ส่งไฟล์</h1>

        <p>แชร์รหัสนี้ให้คนดาวน์โหลด</p>

        <div class="id-box" id="myId">
            ....
        </div>

        <input type="file" id="fileInput">

        <div class="small">
            จำกัดขนาดไฟล์ไม่เกิน 20MB
        </div>

        <div class="status" id="uploadStatus">
            รอเลือกไฟล์
        </div>

    </div>

    <div class="card">

        <h1>📥 ดาวน์โหลดไฟล์</h1>

        <input
            type="text"
            id="peerId"
            placeholder="ใส่รหัส 4 ตัว">

        <button onclick="connectPeer()">
            เชื่อมต่อและดาวน์โหลด
        </button>

        <div class="status" id="downloadStatus">
            รอเชื่อมต่อ
        </div>

    </div>

</div>

<script>

const MAX_FILE_SIZE = 20 * 1024 * 1024;

let selectedFile = null;

// สุ่ม ID สั้น
function generateId(length = 4){

    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for(let i=0;i<length;i++){

        result += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );
    }

    return result;
}

// สร้าง peer
const myPeerId = generateId();

const peer = new Peer(myPeerId);

peer.on("open",(id)=>{

    document.getElementById("myId").innerText = id;
});

// เลือกไฟล์
document.getElementById("fileInput")
.addEventListener("change",(e)=>{

    const file = e.target.files[0];

    if(!file){
        return;
    }

    if(file.size > MAX_FILE_SIZE){

        alert("ไฟล์ใหญ่เกิน 20MB");

        e.target.value = "";

        return;
    }

    selectedFile = file;

    document.getElementById("uploadStatus")
    .innerHTML = `
        <span class="success">
            พร้อมส่ง:
        </span>
        ${file.name}
        <br>
        ${(file.size / 1024 / 1024).toFixed(2)} MB
    `;
});

// รับการเชื่อมต่อ
peer.on("connection",(conn)=>{

    document.getElementById("uploadStatus")
    .innerHTML = `
        มีคนเชื่อมต่อ...
    `;

    conn.on("data", async(data)=>{

        if(data === "REQUEST_FILE"){

            if(!selectedFile){

                conn.send({
                    error:"ยังไม่ได้เลือกไฟล์"
                });

                return;
            }

            document.getElementById("uploadStatus")
            .innerHTML = `
                กำลังส่งไฟล์...
            `;

            const arrayBuffer =
                await selectedFile.arrayBuffer();

            conn.send({
                name:selectedFile.name,
                type:selectedFile.type,
                size:selectedFile.size,
                file:arrayBuffer
            });

            document.getElementById("uploadStatus")
            .innerHTML = `
                <span class="success">
                    ส่งไฟล์สำเร็จ
                </span>
            `;
        }
    });
});

// เชื่อมต่อดาวน์โหลด
function connectPeer(){

    const peerId =
        document.getElementById("peerId")
        .value
        .trim()
        .toUpperCase();

    if(!peerId){

        alert("กรุณาใส่รหัส");

        return;
    }

    document.getElementById("downloadStatus")
    .innerHTML = `
        กำลังเชื่อมต่อ...
    `;

    const conn = peer.connect(peerId);

    conn.on("open",()=>{

        conn.send("REQUEST_FILE");

        document.getElementById("downloadStatus")
        .innerHTML = `
            เชื่อมต่อสำเร็จ
            <br>
            กำลังรอไฟล์...
        `;
    });

    conn.on("data",(data)=>{

        if(data.error){

            document.getElementById("downloadStatus")
            .innerHTML = `
                <span class="error">
                    ${data.error}
                </span>
            `;

            return;
        }

        document.getElementById("downloadStatus")
        .innerHTML = `
            กำลังดาวน์โหลด...
        `;

        const blob = new Blob(
            [data.file],
            {
                type:data.type
            }
        );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download = data.name;

        document.body.appendChild(a);

        a.click();

        a.remove();

        document.getElementById("downloadStatus")
        .innerHTML = `
            <span class="success">
                ดาวน์โหลดสำเร็จ
            </span>
            <br>
            ${data.name}
        `;
    });

    conn.on("error",(err)=>{

        document.getElementById("downloadStatus")
        .innerHTML = `
            <span class="error">
                เชื่อมต่อไม่สำเร็จ
            </span>
        `;

        console.error(err);
    });
}

</script>

</body>
</html>
