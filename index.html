<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>P2P File Share</title>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    padding:20px;
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

input{
    padding:10px;
    width:100%;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="card">

<h2>ฝั่ง Upload</h2>

<p>ID ของคุณ:</p>

<h3 id="myId">กำลังสร้าง...</h3>

<input type="file" id="fileInput">

</div>

<div class="card">

<h2>ฝั่ง Download</h2>

<input type="text"
       id="peerId"
       placeholder="ใส่ Peer ID">

<button onclick="connectPeer()">
เชื่อมต่อ
</button>

</div>

<script>

let selectedFile;

const peer = new Peer();

peer.on('open', (id)=>{

    document.getElementById("myId").innerText = id;
});

document.getElementById("fileInput")
.addEventListener("change",(e)=>{

    selectedFile = e.target.files[0];

    alert("เลือกไฟล์แล้ว");
});

peer.on('connection',(conn)=>{

    conn.on('data', async(data)=>{

        if(data === "REQUEST_FILE"){

            if(!selectedFile){
                conn.send({
                    error:"No file"
                });

                return;
            }

            const arrayBuffer = await selectedFile.arrayBuffer();

            conn.send({
                name:selectedFile.name,
                type:selectedFile.type,
                file:arrayBuffer
            });
        }
    });
});

function connectPeer(){

    const peerId = document.getElementById("peerId").value;

    const conn = peer.connect(peerId);

    conn.on('open', ()=>{

        conn.send("REQUEST_FILE");
    });

    conn.on('data',(data)=>{

        if(data.error){
            alert(data.error);
            return;
        }

        const blob = new Blob([data.file], {
            type:data.type
        });

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;

        a.download = data.name;

        a.click();

        alert("Download เริ่มแล้ว");
    });
}

</script>

</body>
</html>
